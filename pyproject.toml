[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odevio"
version = "1.3.0"
authors = [
    {name="Odevio", email="hello@odevio.com"}
]
description = "Let your AI agent build and publish iOS apps with Odevio - no Mac, no Xcode. Works with any AI agent that supports the Agent Skills standard."
readme = "Readme.rst"
license = {file="LICENSE"}
requires-python = ">=3.9"
keywords = ["Flutter", "iOS", "AI agent", "Claude Code", "App Store", "code signing", "CI/CD", "without a Mac"]
classifiers  = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Natural Language :: English",
]
dependencies = [
    "click==8.0.4",
    "rich==11.2.0",
    "requests==2.27.1",
    "pyjwt==2.4.0",
    "questionary==1.10.0",
    "paramiko==3.0.0",
    "qrcode==7.4.2",
    "sseclient-py==1.8.0",
]

[project.urls]
"Homepage" = "https://www.odevio.com"
"Documentation" = "https://odevio-cli.readthedocs.io/"
"Source" = "https://github.com/Odevio/Odevio-CLI"

[project.scripts]
odevio="odevio.__main__:odevio"
